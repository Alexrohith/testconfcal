<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="96" y1="32" x2="405" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#19A878"/>
      <stop offset="0.52" stop-color="#087A59"/>
      <stop offset="1" stop-color="#004B3A"/>
    </linearGradient>
    <linearGradient id="paper" x1="153" y1="145" x2="322" y2="354" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF7F2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001C15" flood-opacity="0.32"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#001C15" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Brand tile -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Subtle top highlight -->
  <path d="M102 93C129 61 171 48 218 48H364C404 48 437 69 454 100" stroke="#62D5B0" stroke-opacity="0.22" stroke-width="8" stroke-linecap="round"/>

  <!-- Calendar -->
  <g filter="url(#softShadow)">
    <rect x="112" y="144" width="276" height="234" rx="36" fill="url(#paper)"/>
    <path d="M112 205H388" stroke="#087A59" stroke-width="18"/>
    <path d="M166 128V174" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>
    <path d="M334 128V174" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>
  </g>

  <!-- Graduation cap -->
  <g filter="url(#softShadow)">
    <path d="M147 244L249 198L351 244L249 291L147 244Z" fill="#FFFFFF"/>
    <path d="M179 264V304C179 304 211 327 249 327C287 327 319 304 319 304V264L249 297L179 264Z" fill="#FFFFFF"/>
    <path d="M348 244V286" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <circle cx="348" cy="293" r="10" fill="#FFFFFF"/>
  </g>

  <!-- Magnifying glass -->
  <g filter="url(#softShadow)">
    <circle cx="341" cy="324" r="62" fill="#087A59" stroke="#FFFFFF" stroke-width="24"/>
    <path d="M386 369L427 410" stroke="#FFFFFF" stroke-width="27" stroke-linecap="round"/>
  </g>

  <!-- Small brand accent -->
  <circle cx="103" cy="399" r="6" fill="#63D5B0" fill-opacity="0.7"/>
</svg>
